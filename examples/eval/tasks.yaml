# MACE evaluation suite: the tasks every method runs on.
#
# examples/eval_batch.py runs each method on each task; mace/eval/suite.py
# describes the fields. A task passes when every gate workload passes on
# every tile. `expert` is the known passing configuration the expert
# reference builds; `verified: true` means that configuration has passed.
# Candidates stay `verified: false` until a pilot run passes them, and the
# batch runner skips them unless given --include-unverified.
#
# The first four tasks are the cells of the hackathon paper's Table 1,
# with the objectives those runs used.

version: 1

defaults:
  budget:
    max_iterations: 3
    max_wall_s: 3600
    max_usd: 20.0

tasks:
  - id: ariane-2x2-barrier
    core: ariane
    mesh: [2, 2]
    workloads: [barrier_atomic.c]
    objective: Verify the barrier_atomic.c gate workload passes on a 2x2 mesh.
    verified: true
    expert: {}

  - id: ariane-4x4-barrier
    core: ariane
    mesh: [4, 4]
    workloads: [barrier_atomic.c]
    objective: Verify the barrier_atomic.c gate workload passes on a 4x4 mesh.
    verified: true
    # A cold 4x4 Ariane build at MAKEFLAGS=-j1 has taken over an hour.
    budget: {max_wall_s: 7200}
    expert: {}

  - id: pico-2x2-addi
    core: pico
    mesh: [2, 2]
    workloads: [addi.S]
    objective: >-
      Verify the addi.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]

  - id: pico-4x4-addi
    core: pico
    mesh: [4, 4]
    workloads: [addi.S]
    objective: >-
      Verify the addi.S gate workload passes on a 4x4 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]

  # Verified by an expert run: another mesh, MACE's own gate programs,
  # OpenPiton's Ariane C tests, and PicoRV32 ISA tests.

  - id: ariane-4x2-barrier
    core: ariane
    mesh: [4, 2]
    workloads: [barrier_atomic.c]
    objective: Verify the barrier_atomic.c gate workload passes on a 4x2 mesh.
    verified: true
    expert: {}

  - id: pico-4x2-addi
    core: pico
    mesh: [4, 2]
    workloads: [addi.S]
    objective: >-
      Verify the addi.S gate workload passes on a 4x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]

  - id: ariane-2x2-scatter-gather
    core: ariane
    mesh: [2, 2]
    workloads: [scatter_gather.c]
    objective: Verify the scatter_gather.c gate workload passes on a 2x2 mesh.
    verified: true
    expert: {}

  - id: ariane-2x2-producer-consumer
    core: ariane
    mesh: [2, 2]
    workloads: [producer_consumer.c]
    objective: Verify the producer_consumer.c gate workload passes on a 2x2 mesh.
    verified: true
    expert: {}

  - id: ariane-2x2-hello
    core: ariane
    mesh: [2, 2]
    workloads: [hello_world.c]
    objective: Verify the hello_world.c gate workload passes on a 2x2 mesh.
    verified: true
    expert: {}

  - id: ariane-2x2-lrsc-single
    core: ariane
    mesh: [2, 2]
    workloads: [lrsc_single.c]
    objective: Verify the lrsc_single.c gate workload passes on a 2x2 mesh.
    verified: true
    expert: {}

  - id: ariane-2x2-accu
    core: ariane
    mesh: [2, 2]
    workloads: [accu_test.c]
    objective: Verify the accu_test.c gate workload passes on a 2x2 mesh.
    verified: true
    expert: {}

  - id: pico-2x2-lw
    core: pico
    mesh: [2, 2]
    workloads: [lw.S]
    objective: >-
      Verify the lw.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]

  - id: pico-2x2-jal
    core: pico
    mesh: [2, 2]
    workloads: [jal.S]
    objective: >-
      Verify the jal.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]

  - id: pico-2x2-mul
    core: pico
    mesh: [2, 2]
    workloads: [mul.S]
    objective: >-
      Verify the mul.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]

  - id: pico-2x2-beq
    core: pico
    mesh: [2, 2]
    workloads: [beq.S]
    objective: >-
      Verify the beq.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]

  # Candidates. Each needs one passing expert run before it counts. Each of
  # these timed out at the default rtl_timeout, which caps a run at
  # 1,000,000 cycles. OpenPiton's own regression runs hello_world_many.c on
  # a 4x4 mesh with -rtl_timeout 10000000.

  - id: ariane-2x2-hello-many
    core: ariane
    mesh: [2, 2]
    workloads: [hello_world_many.c]
    objective: Verify the hello_world_many.c gate workload passes on a 2x2 mesh.
    expert: {}

  - id: ariane-2x2-shared-var
    core: ariane
    mesh: [2, 2]
    workloads: [add_shared_var.c]
    objective: Verify the add_shared_var.c gate workload passes on a 2x2 mesh.
    expert: {}

  - id: ariane-2x2-lrsc
    core: ariane
    mesh: [2, 2]
    workloads: [lrsc_test.c]
    objective: Verify the lrsc_test.c gate workload passes on a 2x2 mesh.
    expert: {}

  - id: ariane-2x2-two-programs
    core: ariane
    mesh: [2, 2]
    workloads: [barrier_atomic.c, hello_world_many.c]
    objective: >-
      Verify the barrier_atomic.c and hello_world_many.c gate workloads both
      pass on a 2x2 mesh.
    expert: {}

  # Left out. Every hart runs the program, so a test that checks one hart's
  # view of shared memory cannot pass on a mesh: amo_align.c, amoadd_w.S,
  # and the other ISA tests that store to or run atomics on shared data.
  # clint_plic_access.c uses uint64_t without <stdint.h>, which GCC 16
  # rejects. An 8x8 PicoRV32 mesh timed out after 47 minutes of simulation.

  # Co-design: the cache geometry that finishes matmul.c soonest within the
  # area of OpenPiton's default caches. Simulated finish times on a 2x2
  # mesh: 127,013,250 for the default caches; 105,567,250 with a 16 KB L1.5
  # and a 32 KB L2; 101,258,750 with a 16 KB L1D added, the soonest design
  # tried. A 16 KB L1D beside the default 8 KB L1.5 finishes at 114,192,750,
  # and a 32 KB L2 finishes 16,000 after the default 64 KB. Ariane allows
  # neither L1 more ways than the L1.5, and the L1I stays four-way, so the
  # L1.5 is four-way and the L1D at most four-way. OpenPiton's crossbar
  # needs a mesh with one row of tiles, so this task searches the caches
  # only.
  - id: ariane-2x2-matmul-codesign
    core: ariane
    mesh: [2, 2]
    workloads: [matmul.c]
    objective: >-
      Find the cache geometry that finishes the matmul.c gate workload
      soonest on a 2x2 mesh, within the cache area of OpenPiton's default
      caches.
    verified: true
    # A run stops at the lower limit, and OpenPiton's own cycle limit is
    # 1,500,000, so rtl_timeout needs max_cycle to reach 5,000,000.
    rtl_timeout: 5000000
    max_cycle: 5000000
    # Built and simulated one at a time on one checkout, 20 designs take
    # about three hours.
    budget: {max_wall_s: 18000}
    expert: {}
    codesign:
      simulations: 20
      batch: 2
      area_budget_ratio: 1.0
      space:
        l1d: {sizes: [2048, 4096, 8192, 16384], assocs: [1, 2, 4]}
        l15: {sizes: [4096, 8192, 16384], assocs: [4]}
        l2: {sizes: [32768, 65536, 131072], assocs: [4, 8]}
      grid:
        l1d_size: [4096, 8192, 16384]
        l15_size: [4096, 8192, 16384]
        l2_size: [32768, 65536]
