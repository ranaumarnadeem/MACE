# MACE evaluation suite of bugs planted in the design, in the format of
# tasks.yaml.
#
# Each task carries a `source_fault`: a text replacement in the design's RTL
# that every job on the task runs under (see mace/eval/source_faults.py).
# The build reports the error with the file and line, and the gate workload
# cannot pass until the design is repaired, so only a method that can edit
# RTL (mace_rtl, retry_agent_rtl) can pass. mace, one_shot, and retry_agent
# change only the build configuration and are the controls. The expert
# reference fails by design here; its failure is the check that the fault
# breaks the build: the build stops with an error that names the file and
# line. A task is `verified: true` once its expert has failed that way.
#
# A fault must not be one that declaring the missing name repairs: a first
# PicoRV32 fault, a misspelled wire that only the optional coprocessor
# interface reads, was "fixed" by declaring it, and the gate workload still
# passed. The faults here sit on signals the gate workloads need.
#
# Run it with:
#   examples/eval_batch.py --suite examples/eval/tasks_rtl.yaml --include-unverified \
#       --methods mace,mace_rtl,one_shot,retry_agent,retry_agent_rtl

version: 1

defaults:
  budget:
    max_iterations: 3
    max_wall_s: 3600
    max_usd: 20.0

tasks:
  - id: ariane-2x2-hello-rtlfault
    core: ariane
    mesh: [2, 2]
    workloads: [hello_world.c]
    objective: >-
      Verify the hello_world.c gate workload passes on a 2x2 mesh. The design
      in this checkout has an RTL error under piton/design/ that its build
      reports, and the workload cannot pass until the error is fixed.
    verified: true
    expert: {}
    source_fault:
      - path: piton/design/chip/tile/ariane/core/cache_subsystem/wt_l15_adapter.sv
        old: "icache_rtrn_o.inv.vld = rtrn_fifo_data.l15_inval_icache_inval;"
        new: "icache_rtrn_o.inv.vld = rtrn_fifo_data.l15_inval_icache_invalid;"

  - id: pico-2x2-addi-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [addi.S]
    objective: >-
      Verify the addi.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "assign mem_xfer = (mem_valid && mem_ready) ||"
        new: "assign mem_xfer = (mem_valid && mem_readyx) ||"

  # Added after the prompts were tuned on the two tasks above, so no prompt
  # change has seen it: the held-out task.
  - id: ariane-2x2-accu-rtlfault
    core: ariane
    mesh: [2, 2]
    workloads: [accu_test.c]
    objective: >-
      Verify the accu_test.c gate workload passes on a 2x2 mesh. The design in
      this checkout has an RTL error under piton/design/ that its build
      reports, and the workload cannot pass until the error is fixed.
    verified: true
    expert: {}
    source_fault:
      - path: piton/design/chip/tile/ariane/core/cache_subsystem/wt_dcache_ctrl.sv
        old: "{address_tag_q, address_idx_q, address_off_q};"
        new: "{address_tag_q, address_idx_q, address_offs_q};"

  # Held out, session B, defined 2026-10-12, before any directed-test prompt
  # was written. Unlike the three tasks above, these designs build: each bug
  # changes behavior, so the gate workload fails in simulation and a directed
  # test can fail on it. A task is `verified: true` once its expert run
  # (the bug applied) builds and then fails in simulation, and its
  # expert_clean run (no bug applied) passes.
  - id: ariane-2x2-barrier-amobug
    core: ariane
    mesh: [2, 2]
    workloads: [barrier_atomic.c]
    # With the bug the workload hangs, and the default limit of 1,000,000 cycles
    # costs 985 s of wall time per run; the correct design passes in about
    # 25,000 cycles.
    rtl_timeout: 200000
    objective: >-
      Verify the barrier_atomic.c gate workload passes on a 2x2 mesh. The
      design in this checkout has a bug under piton/design/ that makes the
      workload fail in simulation, and it cannot pass until the bug is fixed.
    verified: true
    expert: {}
    source_fault:
      - path: piton/design/chip/tile/l2/rtl/l2_amo_alu.v
        old: "`L2_AMO_ALU_ADD: amo_64b_tmp = adder_sum[63:0];"
        new: "`L2_AMO_ALU_ADD: begin adder_operand_b = -$signed(amo_operand_b); amo_64b_tmp = adder_sum[63:0]; end"

  - id: pico-2x2-sh-rtlbug
    core: pico
    mesh: [2, 2]
    workloads: [sh.S]
    objective: >-
      Verify the sh.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has a bug under piton/design/ that makes the
      workload fail in simulation, and it cannot pass until the bug is fixed.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "latched_is_lh: reg_out <= $signed(mem_rdata_word[15:0]);"
        new: "latched_is_lh: reg_out <= mem_rdata_word[15:0];"

  # The third bug changed twice on 2026-10-12, before any directed-test prompt
  # existed. The first, an `amomax` bug in l2_amo_alu.v on amomax_w.S, failed
  # its gate on the correct design: an AMO test checks shared memory from every
  # hart, and four harts race on it. The second, a byte-store strobe in
  # picorv32.v on sb.S, passed its gate with the bug: the L1.5 decoder reads
  # only the size from the strobe, so the lane never reaches memory.
  - id: pico-2x2-srai-rtlbug
    core: pico
    mesh: [2, 2]
    workloads: [srai.S]
    objective: >-
      Verify the srai.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has a bug under piton/design/ that makes the
      workload fail in simulation, and it cannot pass until the bug is fixed.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "instr_srai || instr_sra: reg_op1 <= $signed(reg_op1) >>> 4;"
        new: "instr_srai || instr_sra: reg_op1 <= reg_op1 >> 4;"

  # Added 2026-10-12 after the Ariane bug above turned out to hang every program,
  # the C runtime's exit barrier included, so it cannot show whether a test
  # found the bug (the null test of mace.eval.directed shows it). This one is
  # defined after the first version of the test task's prompt, but that prompt
  # was tuned on the development bug and the first three tasks only.
  - id: pico-2x2-mulhsu-rtlbug
    core: pico
    mesh: [2, 2]
    workloads: [mulhsu.S]
    objective: >-
      Verify the mulhsu.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has a bug under piton/design/ that makes the
      workload fail in simulation, and it cannot pass until the bug is fixed.
    verified: true
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "wire instr_rs2_signed = |{instr_mulh};\n\n\treg pcpi_wait_q;"
        new: "wire instr_rs2_signed = |{instr_mulh, instr_mulhsu};\n\n\treg pcpi_wait_q;"

  # Second set of build errors, defined 2026-10-23 before any run on them and
  # with no prompt changed afterwards: held out for the mace_rtl and
  # retry_agent_rtl comparison. Each misspells a name on a path the task's gate
  # workload needs, inside logic that is always elaborated, so the build stops
  # with an error that names the file and line, and declaring the misspelled
  # name builds a design whose workload still fails. Each misspelled name
  # appears nowhere else in the design. They stay `verified: false` until
  # their expert run fails at the build and their expert_clean run passes.
  - id: pico-2x2-lw-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [lw.S]
    objective: >-
      Verify the lw.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "instr_lw    <= is_lb_lh_lw_lbu_lhu && mem_rdata_q[14:12] == 3'b010;"
        new: "instr_lw    <= is_lb_lh_lw_lbu_lh && mem_rdata_q[14:12] == 3'b010;"

  - id: pico-2x2-jal-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [jal.S]
    objective: >-
      Verify the jal.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "instr_jal     <= mem_rdata_latched[6:0] == 7'b1101111;"
        new: "instr_jal     <= mem_rdata_latchd[6:0] == 7'b1101111;"

  - id: pico-2x2-beq-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [beq.S]
    objective: >-
      Verify the beq.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "instr_beq   <= is_beq_bne_blt_bge_bltu_bgeu && mem_rdata_q[14:12] == 3'b000;"
        new: "instr_beq   <= is_beq_bne_blt_bge_bltu_bgeu && mem_rdat_q[14:12] == 3'b000;"

  - id: pico-2x2-mul-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [mul.S]
    objective: >-
      Verify the mul.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "(ENABLE_MUL || ENABLE_FAST_MUL) && pcpi_mul_ready, ENABLE_DIV"
        new: "(ENABLE_MUL || ENABLE_FAST_MUL) && pcpi_mul_rdy, ENABLE_DIV"

  - id: ariane-2x2-lrsc-rtlfault
    core: ariane
    mesh: [2, 2]
    workloads: [lrsc_test.c]
    objective: >-
      Verify the lrsc_test.c gate workload passes on a 2x2 mesh. The design in
      this checkout has an RTL error under piton/design/ that its build
      reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert: {}
    source_fault:
      - path: piton/design/chip/tile/ariane/core/cache_subsystem/wt_dcache_missunit.sv
        old: "assign mem_data_o.amo_op = (amo_sel) ? amo_req_i.amo_op    : AMO_NONE;"
        new: "assign mem_data_o.amo_op = (amo_sel) ? amo_req_i.amo_opcode    : AMO_NONE;"

  - id: ariane-2x2-producer-consumer-rtlfault
    core: ariane
    mesh: [2, 2]
    workloads: [producer_consumer.c]
    objective: >-
      Verify the producer_consumer.c gate workload passes on a 2x2 mesh. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert: {}
    source_fault:
      - path: piton/design/chip/tile/ariane/core/cache_subsystem/wt_dcache_wbuffer.sv
        old: "assign miss_req_o = (|dirty) && free_tx_slots;"
        new: "assign miss_req_o = (|dirty) && free_tx_slot;"

  # Third set, defined 2026-10-23 after the second set's runs and BEFORE the fix
  # those runs led to (build errors that name an undefined name now list the
  # closest declared names). The fix was written while looking at the second
  # set, so the second set is its tuning set; these three and the two Ariane
  # tasks above are held out from it. Same rules as the second set.
  - id: pico-2x2-sh-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [sh.S]
    objective: >-
      Verify the sh.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "instr_sh    <= is_sb_sh_sw && mem_rdata_q[14:12] == 3'b001;"
        new: "instr_sh    <= is_sb_sh_sv && mem_rdata_q[14:12] == 3'b001;"

  - id: pico-2x2-srai-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [srai.S]
    objective: >-
      Verify the srai.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "instr_srai  <= is_alu_reg_imm && mem_rdata_q[14:12] == 3'b101 && mem_rdata_q[31:25] == 7'b0100000;"
        new: "instr_srai  <= is_alu_reg_im && mem_rdata_q[14:12] == 3'b101 && mem_rdata_q[31:25] == 7'b0100000;"

  - id: pico-2x2-bgeu-rtlfault
    core: pico
    mesh: [2, 2]
    workloads: [bgeu.S]
    objective: >-
      Verify the bgeu.S gate workload passes on a 2x2 pico mesh in a single
      task. That task needs the CONFIG_DISABLE_BIST_CLEAR RTL define. The
      design in this checkout has an RTL error under piton/design/ that its
      build reports, and the workload cannot pass until the error is fixed.
    verified: false
    budget: {max_usd: 0.5}  # credits are short (2026-10-23); a run costs cents
    expert:
      config_rtl: [CONFIG_DISABLE_BIST_CLEAR]
    source_fault:
      - path: piton/design/chip/tile/pico/rtl/picorv32.v
        old: "instr_bgeu  <= is_beq_bne_blt_bge_bltu_bgeu && mem_rdata_q[14:12] == 3'b111;"
        new: "instr_bgeu  <= is_beq_bne_blt_bge_bltu_bgu && mem_rdata_q[14:12] == 3'b111;"
