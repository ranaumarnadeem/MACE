# MACE cluster: WSL head (native OpenPiton toolchain, validated locally)
# + GCP workers (hackathon compute credits landed on project mace-508004).
#
# Both node types are BARE — no Docker. openpiton_local already ran that way
# all session (every acceptance test, the MCP tool, 143 tests). openpiton_gcp
# mirrors it: gcp_nodes' own default host setup installs git/conda for us
# (skip_default_setup defaults to False), so setup_commands below only needs
# the OpenPiton-specific pieces — same apt packages, RISC-V toolchain and
# zicsr/C23 patches this repo already proved work, just applied to a fresh VM
# instead of a Dockerfile. See dockerfiles/openpiton-chia.Dockerfile's history
# if a container is wanted again later; nothing here depends on it existing.
#
# Env vars to export before `chia up cluster.yaml` / `chia down cluster.yaml`:
#   HEAD_IP       this WSL machine's IP CHIA uses to SSH in, e.g.:
#                 export HEAD_IP=$(hostname -I | awk '{print $1}')
#   GCP_PROJECT   your GCP project id (from hackathon registration)
#   GCP_SSH_KEY   private key whose .pub gets injected into GCP VM metadata,
#                 e.g. ${HOME}/.ssh/id_ed25519
#   TS_AUTHKEY    reusable tailscale auth key (only needed once gcp_nodes is
#                 actually in use — see "Cloud nodes" below)
#
# GCP API access: `gcloud auth application-default login` on this machine
# (+ `gcloud auth application-default set-quota-project $GCP_PROJECT`),
# `pip install google-cloud-compute`, Compute Engine API enabled.
#
# The gcp_nodes / openpiton_gcp config below has not been run against real
# GCP yet — it's written to the same standard as the rest of the adapter,
# but treat the FIRST real `chia up` against it as a fresh acceptance test,
# not an assumption.

cluster_name: MaceCluster

provider:
    head_ip: ${HEAD_IP}

auth:
    ssh_user: ${USER}
    ssh_private_key: ${GCP_SSH_KEY}   # reused: also authorized in this head's own authorized_keys

available_node_types:

    # Runs directly on the WSL head — no container, uses the OpenPiton +
    # Verilator toolchain already validated on this machine (PITON_ROOT etc.
    # set up in ~/.bashrc or via worker_setup_commands below).
    #
    # Verilator specifically is layered in from flake.nix's own
    # `packages.verilator` output (the same nixpkgs-verilator pin the Nix
    # devShell uses, see flake.nix's own comments for why a plain tagged
    # release isn't enough on its own) rather than left on whatever this
    # machine's system install happens to be -- that system install is a
    # "devel" snapshot whose own verilator_coverage faults on --version
    # alone, a real, previously-hit bug in this project (see flake.nix).
    # `mace` is resolved via Python instead of a hardcoded checkout path,
    # since it's already pip-installed editable into chia_env on any
    # machine this runs on -- no new env var, no per-machine path to keep
    # in sync.
    openpiton_local:
        resources: {"openpiton": 2}
        num_workers: 1
        compatible_ips: ["${HEAD_IP}"]
        worker_env_commands:
            - source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env &&
                MACE_ROOT=$(python3 -c "import mace, os; print(os.path.dirname(os.path.dirname(mace.__file__)))") &&
                VERILATOR_STORE=$(nix build --no-link --print-out-paths "$MACE_ROOT#verilator") &&
                export VERILATOR_ROOT="$VERILATOR_STORE/share/verilator" &&
                export PATH="$VERILATOR_STORE/bin:$PATH"

    # Cloud burst capacity, now that GCP_PROJECT is set (hackathon credits landed).
    # 1 worker is enough for the 2x2 acceptance test itself (proving a 2x2
    # build works on GCP compute) -- parallel-worker dispatch is already
    # proven separately (mace.integrator.integrate_parallel) and doesn't
    # depend on machine size, so a second GCP worker here would only add
    # cost without proving anything new.
    openpiton_gcp:
        resources: {"openpiton": 8}
        num_workers: 1
        compatible_ips: ["@openpiton_gcp:0"]
        # MAKEFLAGS=-j1: a real 2x2 Ariane build attempt crashed this worker
        # (Ray heartbeat-missed, matching the exact OOM signature already
        # diagnosed locally for 4x4 -- unconstrained parallel cc1plus during
        # Verilator's C++ compile). Setting this in the DRIVER script's own
        # os.environ does NOT reach a remotely-dispatched task's environment
        # -- that comes from how the worker's own Ray process was started, so
        # it has to be set here, in the environment that process inherits.
        worker_env_commands: ["source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env && export MAKEFLAGS=-j1"]
        # Runs after file_mounts has synced scripts/ to ~/mace_scripts/ (see
        # that top-level key's own comment) and after gcp_nodes.openpiton_gcp.
        # setup_commands has cloned ~/openpiton -- the one place in this file
        # that calls the real script instead of re-deriving its logic.
        worker_setup_commands:
            - bash ~/mace_scripts/patch_openpiton.sh ~/openpiton

head_env_commands: ["source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"]
head_setup_commands: ["source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"]
head_start_ray_commands:
    - "source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env && ray stop"
    - "source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env && \
        ray start --head --port=6379 \
        --include-dashboard=True --dashboard-agent-listen-port=0"

worker_start_ray_commands:
    - "source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env && ray stop"
    - "source $HOME/miniconda3/etc/profile.d/conda.sh && conda activate chia_env && \
        ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0"

# Rsync'd to every node (head and worker alike, before any commands run --
# see chia's own cluster_config_reference.rst execution-order diagram) so
# scripts/patch_openpiton.sh is a real, synced file on a worker by the time
# openpiton_gcp's own worker_setup_commands (below) needs to call it,
# instead of hand-duplicating its logic inline the way gcp_nodes.
# openpiton_gcp.setup_commands still has to (that phase runs BEFORE this
# rsync, against a bare-provisioned VM with none of this repo on it yet --
# see that section's own comment). Runs against openpiton_local (the head)
# too, since file_mounts has no per-node-type scoping in chia's config
# schema -- a harmless, redundant self-copy there, not a problem (it
# already has the whole repo checked out and doesn't read this copy).
# Trailing "/" on the local side: copies scripts/'s contents into
# ~/mace_scripts/, not scripts/ nested a level deeper inside it.
file_mounts:
    "~/mace_scripts/": "./scripts/"

# --- Cloud nodes ---
gcp_nodes:
    project: ${GCP_PROJECT}
    zone: us-central1-b
    openpiton_gcp:
        # c2-standard-30 was the original size target, but this fresh GCP
        # project has a 12-vCPU-total default quota and zero quota for the
        # C2 family specifically (both real, confirmed via direct gcloud
        # create attempts, not assumptions) -- 8 vCPUs is the largest count
        # that fits under the cap. e2-standard-8 (8 vCPU/32GB) crashed mid-build
        # on a real 2x2 Ariane attempt -- Ray heartbeat-missed, the same OOM
        # signature already diagnosed locally for 4x4 (unconstrained parallel
        # cc1plus during Verilator's C++ compile). e2-highmem-8 keeps the same
        # 8 vCPUs (same quota footprint) but roughly doubles memory to ~64GB,
        # for headroom against that same failure mode -- paired with the
        # MAKEFLAGS=-j1 fix above. Revisit machine family entirely if a quota
        # increase is ever requested and granted.
        machine_type: e2-highmem-8
        count: 1
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        # The image's own default boot disk (~10GB) ran out of space extracting
        # just the RISC-V toolchain (real failure, first attempt) -- an
        # OpenPiton checkout + Verilator build artifacts need real headroom.
        disk_size_gb: 64
        spot: false                    # spot e2-standard-8 hit stockout in both
                                        # us-central1-a and -b within minutes of
                                        # each other (confirmed via gcloud compute
                                        # operations list -- ZONE_RESOURCE_POOL_
                                        # EXHAUSTED_WITH_DETAILS/stockout both times);
                                        # on-demand for this short diagnostic run,
                                        # revert to spot for any longer-running use
        ssh_user: chia
        ssh_public_key: ${GCP_SSH_KEY}.pub
        ssh_private_key: ${GCP_SSH_KEY}
        setup_commands:
            # System deps (matches what dockerfiles/openpiton-chia.Dockerfile
            # installs; kept in sync by hand since apt has no lockfile here).
            #
            # verilator is deliberately NOT installed from apt here -- Ubuntu
            # 24.04's package is 5.020, older than even the 5.028 this
            # project already found broken (verilator/verilator#5820, an
            # internal V3EmitCFunc.cpp crash on this project's own RTL,
            # fixed upstream only in 5.036 -- see flake.nix's own comment for
            # the full finding). Built from source at the pinned tag instead,
            # a few setup_commands below. autoconf + perl added here because
            # they're verilator's own build deps and weren't otherwise needed
            # on this image; everything else it needs (gawk, bison, flex,
            # zlib1g-dev, g++/make via build-essential) was already here.
            - sudo apt-get update -qq && sudo apt-get install -y -qq
                gawk build-essential bison flex texinfo autoconf perl
                python3-pexpect libusb-1.0-0-dev default-jdk zlib1g-dev
                valgrind csh device-tree-compiler
                libbit-vector-perl libelf-dev
                dos2unix openssh-client rsync
                curl ca-certificates xz-utils git
            # Verilator 5.052, built from source at the same tag flake.nix
            # pins via nixpkgs-verilator (see that file's own comment for why
            # this exact version: a real tagged release, and past 5.036 for
            # the #5820 fix above). `make install`'s default PREFIX=/usr/local
            # puts verilator/verilator_coverage on PATH ahead of nothing else
            # (apt's own package was never installed), so no PATH/
            # VERILATOR_ROOT juggling is needed here the way openpiton_local's
            # worker_env_commands needs it against a pre-existing system install.
            - git clone --depth 1 --branch v5.052
                https://github.com/verilator/verilator.git ~/verilator-src
            - cd ~/verilator-src && autoconf && ./configure && make -j$(nproc) &&
                sudo make install
            - verilator --version
            # Prebuilt RISC-V toolchain -> /opt/riscv (same asset validated
            # on this project's WSL host and in the Docker image).
            - sudo mkdir -p /opt/riscv && curl -fL
                https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2026.08.27/riscv64-elf-ubuntu-24.04-gcc.tar.xz
                | sudo tar -xJ -C /opt/riscv --strip-components=1
            - echo 'export RISCV=/opt/riscv' >> ~/.bashrc
            # OpenPiton, pinned to the commit + Ariane submodule this repo
            # has validated (state_def.PitonConfig.source_rev/ariane_rev).
            - test -d ~/openpiton ||
                git clone https://github.com/PrincetonUniversity/openpiton.git ~/openpiton
            - cd ~/openpiton && git checkout 1c6bfd2 &&
                git submodule update --init --recursive --force piton/design/chip/tile/ariane
            # zicsr/zifencei + C23 + VM_COVERAGE patches: applied later, in
            # available_node_types.openpiton_gcp.worker_setup_commands, by
            # calling the real scripts/patch_openpiton.sh -- not here, since
            # this phase (gcp_nodes.setup_commands, bare-VM provisioning) runs
            # before file_mounts has synced this repo's scripts/ onto the
            # machine (see the top-level file_mounts key's own comment for
            # the full account of why, and of the drift this used to cause
            # when these were hand-duplicated inline here instead).

tailnet:
    manage_all: true        # WSL sits behind NAT; tailnet avoids needing
    auth_key: ${TS_AUTHKEY} # reverse-SSH-tunnel/port-forwarding on this side
