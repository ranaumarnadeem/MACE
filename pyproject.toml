[project]
name = "mace"
version = "0.0.1"
description = "MACE: A Multicore Agentic Co-Design Engine"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.11"
dependencies = ["typer>=0.12", "rich>=13", "ray>=2.54,<3"]

# CHIA (the `chialoops` distribution) is intentionally NOT listed here: it is
# not on PyPI, so it is installed separately from a clone of its v1.0.1
# release (`git clone --branch v1.0.1 ...`, then `pip install -e /path/to/chia`).
# See README.

[project.scripts]
mace = "mace.cli:main"

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools>=77"]  # 77 added the SPDX `license` string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chia_openpiton*", "mace*"]

[tool.pytest.ini_options]
# Import tests under their full package path, not by bare filename: the test
# directories have no __init__.py and several files share names across packages.
addopts = "--import-mode=importlib -q"
testpaths = ["chia_openpiton/test", "mace/test"]
markers = [
    "openpiton: needs a real OpenPiton checkout and Verilator (set OPENPITON_TEST_REAL=1)",
    "ray_local: needs a local Ray instance",
]
