[project]
name = "mace"
version = "0.0.1"
description = "Multicore Agentic Co-Design Engine: LLM agents that build and verify multicore OpenPiton systems on CHIA"
authors = [
    {name = "Rana Umar Nadeem"},
    {name = "Samrah Mumtaz"},
    {name = "Muhammad Imran"},
]
keywords = [
    "OpenPiton", "CHIA", "multicore", "LLM agents", "agentic AI",
    "hardware design automation", "RISC-V", "network on chip", "Verilator",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.11"
dependencies = ["typer>=0.12", "rich>=13", "ray>=2.54,<3"]

# CHIA (the `chialoops` distribution) installs separately, before MACE, at the
# v1.0.1 release every result used: `nix develop` runs
# `pip install chialoops==1.0.1` itself, and other setups run it first, or
# `pip install -e` on a clone of the v1.0.1 tag. See README.

[project.urls]
Homepage = "https://ranaumarnadeem.github.io/MACE/"
Documentation = "https://ranaumarnadeem.github.io/MACE/"
Repository = "https://github.com/ranaumarnadeem/MACE"

[project.scripts]
mace = "mace.cli:main"

[project.optional-dependencies]
test = ["pytest==9.0.3"]
# The co-design Bayesian-optimization baseline (mace.codesign.search.BayesianSearch).
eval = ["optuna>=3.6"]

[build-system]
requires = ["setuptools>=77"]  # 77 added the SPDX `license` string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chia_openpiton*", "mace*"]

# Data files read at runtime: the gate workloads and their checksums
# (mace/workloads.py), and the logs compare_to_fixture() reads
# (chia_openpiton/tools.py). Without these, a non-editable install lacks them.
[tool.setuptools.package-data]
mace = ["workloads/*.c", "workloads/CHECKSUMS"]
chia_openpiton = ["test/fixtures/*.log"]

[tool.pytest.ini_options]
# Import tests under their full package path, not by bare filename: the test
# directories have no __init__.py and several files share names across packages.
addopts = "--import-mode=importlib -q"
testpaths = ["chia_openpiton/test", "mace/test"]
markers = [
    "openpiton: needs a real OpenPiton checkout and Verilator (set OPENPITON_TEST_REAL=1)",
    "ray_local: needs a local Ray instance",
]
