name: docs

# Builds the Sphinx site in docs/ and publishes it to GitHub Pages
# (Settings > Pages > Source: GitHub Actions). Pull requests only build it,
# with warnings as errors, so a broken page fails before it reaches main.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Build
        run: make -C docs SPHINXOPTS="-W --keep-going"

      # A renamed or removed page breaks its llms.txt entry without a warning.
      - name: llms.txt links resolve to built pages
        run: |
          python - <<'EOF'
          import pathlib, re, sys

          base = "https://ranaumarnadeem.github.io/MACE/"
          built = pathlib.Path("docs/_build")
          urls = re.findall(r"\((" + re.escape(base) + r"[^)]*)\)", (built / "llms.txt").read_text())
          missing = [u for u in urls if not (built / u[len(base):]).is_file()]
          print(f"{len(urls)} site links in llms.txt, {len(missing)} missing")
          sys.exit("\n".join(missing) if missing else 0)
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
