name: docs

# Builds the Sphinx site in docs/ and publishes it to GitHub Pages
# (Settings > Pages > Source: GitHub Actions). Pull requests only build it,
# with warnings as errors, so a broken page fails before it reaches main.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Build
        run: make -C docs SPHINXOPTS="-W --keep-going"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
