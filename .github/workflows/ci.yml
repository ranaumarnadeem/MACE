name: CI

# Upstream CHIA runs no tests in CI (its workflows only build images), but two
# people commit here daily into one integration branch, so every push runs
# these jobs. None needs OpenPiton or an LLM. The weekly run catches a new
# release of an unpinned dependency, such as Ray, breaking the tests.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch cancels the branch's older run; on main every
# commit keeps its own.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the checkers
        run: >
          pip install ruff==0.16.10 shellcheck-py==0.11.0.1
          actionlint-py==1.7.12.25 cffconvert==2.0.0

      # pyproject.toml selects the checks: syntax errors and all of Pyflakes.
      - name: Python (ruff)
        run: ruff check --output-format=github .

      - name: Shell scripts (bash -n, shellcheck)
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh

      # actionlint also runs shellcheck on each step's script.
      - name: Workflows (actionlint)
        run: actionlint

      # The tier-0 job checks what importing chia_openpiton loads; this also
      # catches an import of mace inside a function.
      - name: chia_openpiton has no import of mace
        run: |
          if grep -rnE '^\s*(from|import)\s+mace(\.|\s|$)' chia_openpiton --include='*.py'; then
            echo "chia_openpiton must not import mace (see .claude/CLAUDE.md)"
            exit 1
          fi

      - name: Docs writing rules
        run: python scripts/check_docs_style.py

      - name: CITATION.cff
        run: cffconvert --validate

  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Python pinned inside the CHIA worker images.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CHIA v1.0.1
        run: pip install chialoops==1.0.1

      - name: Install mace and test deps
        run: pip install -e ".[test,eval]"

      - name: chia_openpiton must not depend on mace
        run: |
          python -c "
          import chia_openpiton, sys
          leaked = sorted(m for m in sys.modules if m.startswith('mace'))
          assert not leaked, f'chia_openpiton pulled in {leaked}'
          print('isolation OK')
          "

      - name: Tier-0 tests
        run: >
          pytest chia_openpiton/test mace/test -q --durations=10
          --ignore=chia_openpiton/test/cluster --ignore=mace/test/cluster

  tier1:
    # A live local Ray instance and a stub sims: the dispatch, placement, and
    # replay paths that tier 0 replaces with fakes. The tests that need a
    # patched OpenPiton checkout or a GCP worker skip themselves.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CHIA v1.0.1
        run: pip install chialoops==1.0.1

      - name: Install mace and test deps
        run: pip install -e ".[test,eval]"

      - name: Tier-1 tests
        run: pytest chia_openpiton/test/cluster mace/test/cluster -q -rs --durations=10

  package:
    # Installs the wheel, without -e, into a clean venv and runs it from
    # outside the checkout, so a module or data file the wheel leaves out
    # fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the sdist and the wheel
        run: |
          pip install build==1.6.1
          python -m build

      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install chialoops==1.0.1 dist/*.whl

      - name: The installed package runs
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/mace" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import chia_openpiton.tools as tools
          import mace
          from mace.workloads import verify_checksums

          assert "site-packages" in mace.__file__, mace.__file__
          verify_checksums()
          assert sorted(tools._FIXTURES_DIR.glob("*.log")), "no fixture logs installed"
          print("installed package OK:", mace.__file__)
          EOF
